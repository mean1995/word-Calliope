<!DOCTYPE html>
<html lang="en" data-ui-art="ready">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Καλλιόπη</title>
<link rel="stylesheet" href="style.css">
<!-- Web App (1.1.6.1): installable from iPad Safari "Add to Home Screen" and macOS
     Safari "Add to Dock". Every address below is relative to this file, because the
     published build lives in the /word-Calliope/ sub-path of GitHub Pages. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#F8F8F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Καλλιόπη">
</head>
<body>

<!-- §43 Paper + Primary Controls · §44 nine controls · §45 English text, no icons
     1.1.1: the top bar is a pure controls area again; the mark moved to the machine body. -->
<nav class="bar" id="bar" aria-label="Primary controls">
  <div class="bar-controls">
  <button type="button" id="btn-new">NEW</button>
  <button type="button" id="btn-open">OPEN</button>
  <button type="button" id="btn-save">SAVE</button>
  <button type="button" id="btn-pdf">EXPORT PDF</button>
  <button type="button" id="btn-zoom">ZOOM FIT</button>
  <button type="button" id="btn-return">AUTO RETURN ON</button>
  <button type="button" id="btn-sound">SOUND ON</button>
  <button type="button" id="btn-paper">PAPER WHITE</button>
  <button type="button" id="btn-ribbon">RIBBON BLACK</button>
  <!-- 2026-10-16 (VIC): the full-page browse pair, between RIBBON and HELP. Two flat controls, not
       a dropdown (Dev-Memo-0.1.2: no new secondary menus). Labels are VIC's key names
       PgUp / PgDn; the KalliopeButton subset was widened to a-z for them (LICENSE-DOTO.txt). -->
  <button type="button" id="btn-pageup">PgUp</button>
  <button type="button" id="btn-pagedown">PgDn</button>
  <button type="button" id="btn-help">HELP</button>
  </div>
</nav>

<!-- §07 one sheet at a time; §12/§13 the sheet is a window over one continuous text -->
<div class="stage" id="stage">
  <div class="stage-inner" id="stage-inner">
    <!-- ======================================================== 1.1.6.1 UI integration
         THE MACHINE FRAME (1.1.6.1, UI-Delivery-1.1.6-r1). The delivered machine art and the
         sheet now live inside ONE scaled box: the machine frame is 1230.2131979695432 x
         1092.0980420594634 document px, the sheet sits in it at x = 207.10659898477158, and the
         document ZOOM is a transform on this frame (moved up from the throat, R4 §6.2), so the
         machine, the sheet and the chrome share one scale. It is also what fitZoom() fits, so the
         whole machine stays inside the viewport - the delivery's own device budget assumes exactly
         that (FIT = (viewport height - 81) / 1092.098).
         Stacking, back to front, is the delivery's order: rear layer -> live sheet -> print head
         -> front layer (nameplate and page-number base baked in) -> page-counter text.
         Both machine layers are decorative application chrome: pointer-events:none so paper clicks
         and drag-selection are untouched (§2.4), aria-hidden, and @media print hides the whole
         .stage - none of it can reach TXT, SAVE, Recovery, Print or PDF. -->
    <div class="machine-frame" id="machine-frame">

      <!-- rear layer: the roller behind the sheet, visible only through the slot below the throat -->
      <div class="machine-layer machine-back" aria-hidden="true">
        <img class="machine-art" src="assets/machine/machine-rear.png" alt="">
      </div>

      <!-- the sheet: .paper-clip is the machine's throat. It carries no transform any more (the
           frame has it) and still cuts the sheet off at 1in + 54 rows = 960 document px, so only
           the part of the sheet that has come OUT of the machine is drawn. -->
      <div class="paper-clip" id="paper-clip">
        <div class="paper" id="paper">
          <div class="sheet-window" id="sheet-window"><!-- editor built by app.js --></div>
          <!-- Colophon centred in the paper's bottom margin. Its place is ON THE SHEET, so it
               lives inside .paper: it travels with the paper and the throat cuts it off like
               everything else below the print line. Romanised on purpose: the CJK slot's Greek
               capitals are drawn ~16% shorter than its Latin capitals. P05 (keep or cancel the
               paper colophon) is still open, and at this throat the mark spends the whole run
               inside the machine. -->
          <div class="paper-mark" id="paper-mark" aria-hidden="true">WORD KALLIOPE BY VIC</div>
        </div>
      </div>

      <!-- machine parts that never move relative to the machine: the print head (its own artwork,
           independent of the body - §4.1 LOCKED), the front layer and the page-counter text. -->
      <div class="machine-fixed" id="machine-fixed" aria-hidden="true">
        <div class="print-head" id="print-head"><img class="head-art" src="assets/machine/printhead.png" alt=""></div>
        <!-- Front layer in three clipped slices (see .guard-* in style.css): slices 1+2 keep only
             what is OUTSIDE the sheet above the throat, slice 3 keeps everything below the throat,
             so the delivered bail crossbar and the tower edges cannot cover the sheet. -->
        <div class="machine-front" aria-hidden="true">
          <img class="machine-art guard-left" src="assets/machine/machine-front.png" alt="">
          <img class="machine-art guard-right" src="assets/machine/machine-front.png" alt="">
          <img class="machine-art guard-low" src="assets/machine/machine-front.png" alt="">
          <!-- the unclipped slice: shown instead of the three above once <html> carries
               data-machine-front="whole" (front layer re-exported with the bail below the throat) -->
          <img class="machine-art guard-whole" src="assets/machine/machine-front.png" alt="">
        </div>
        <div class="page-counter" id="page-counter">01/01</div>
      </div>

    </div>
  </div>
</div>

<!-- §14 print-only DOM, always kept out of the screen tree -->
<div id="print-root"></div>

<!-- §28 native file flow only, no custom file manager -->
<input type="file" id="file-input" accept=".txt,text/plain" hidden>

<script src="app.js"></script>
</body>
</html>
